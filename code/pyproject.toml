[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragsec"
version = "0.1.0"
description = "Training-free RAG for malicious PyPI package detection"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "rank-bm25>=0.2",
    "faiss-cpu>=1.7",
    "openpyxl>=3.1",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]
